# Two Databricks SQL alerts.
#   dq_run_summary  Silver + Gold. One email after every run of e2e_medallion_pipeline (an alert_task after
#                   gold_aggregate), even when everything passed. A table with one row per layer and entity from
#                   dq_gate_log for the latest Silver/Gold run (matching job_id and run_id): run time, rows checked,
#                   passed, quarantined and the failed rules with their counts. It carries no records; the text above
#                   the table links to dq_gate_log and to the quarantine table.
#   dq_failure_alert_platinum  Platinum, unchanged for now (emails only when something failed).
# The alerts' own schedules are paused: the job evaluates them after every run.
#
# {{QUERY_RESULT_TABLE}} is NOT a bundle placeholder. It is a Databricks alert variable that puts the
# query result into the email. Leave it as it is.

# Links point at Catalog Explorer: ${workspace.host}/explore/data/<catalog>/<schema>/<table>

resources:
  alerts:
    dq_run_summary:
      display_name: "[${bundle.target}] E2E - DQ summary, Silver and Gold"
      custom_summary: "DQ summary for the latest Silver and Gold run"
      custom_description: |
        DQ summary for the latest Silver and Gold pipeline run: one row per layer and entity, from dq_gate_log.

        Summary table (all runs):   ${workspace.host}/explore/data/${var.catalog}/${var.audit_schema}/dq_gate_log
        Silver quarantined records of the latest run:
        ${workspace.host}/explore/data/${var.catalog}/${var.formatted_exception_schema}/orders_quarantine_latest_run
        Gold quarantined records of the latest run (exists once a Gold row has failed):
        ${workspace.host}/explore/data/${var.catalog}/${var.published_exception_schema}/orders_quarantine_latest_run
        "Latest run" moves on with each run, so click soon after the email.

        {{QUERY_RESULT_TABLE}}

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      # Short columns so the email table does not wrap words. A run with no Silver/Gold gate result still
      # returns one row saying so, so an email is sent after every run.
      query_text: |
        WITH latest AS (
          SELECT run_id, job_id
          FROM `${var.catalog}`.`${var.audit_schema}`.`dq_gate_log`
          WHERE layer IN ('silver', 'gold')
            AND event_timestamp >= current_timestamp() - INTERVAL 30 MINUTES
          ORDER BY event_timestamp DESC
          LIMIT 1
        )
        SELECT Layer, Entity, `Run (UTC)`, Checked, Passed, Quarantined, `Failed rules`
        FROM (
          SELECT 0 AS ord, g.event_timestamp AS ts,
                 INITCAP(g.layer) AS Layer,
                 g.entity AS Entity,
                 DATE_FORMAT(g.event_timestamp, 'HH:mm') AS `Run (UTC)`,
                 g.rows_checked AS Checked,
                 g.rows_passed AS Passed,
                 g.rows_quarantined AS Quarantined,
                 CASE WHEN g.rows_quarantined = 0 THEN 'None - all checks passed'
                      ELSE ARRAY_JOIN(TRANSFORM(MAP_ENTRIES(g.failed_rules),
                           r -> CONCAT(r.key, ': ', CAST(r.value AS STRING))), ', ') END AS `Failed rules`
          FROM `${var.catalog}`.`${var.audit_schema}`.`dq_gate_log` g
          JOIN latest l ON g.run_id = l.run_id AND g.job_id = l.job_id
          WHERE g.layer IN ('silver', 'gold')
          UNION ALL
          SELECT 1, CAST(NULL AS TIMESTAMP), '-', '-', '-', CAST(NULL AS BIGINT), CAST(NULL AS BIGINT), CAST(NULL AS BIGINT),
                 'No Silver or Gold DQ gate result was logged in the last 30 minutes'
          WHERE NOT EXISTS (SELECT 1 FROM latest)
        )
        ORDER BY ord, ts

      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: "IS_NOT_NULL"
        source:
          name: "Layer"
          display: "Layer"
        empty_result_state: "OK"
        notification:
          notify_on_ok: false
          retrigger_seconds: 1
          subscriptions:
            - user_email: ${workspace.current_user.userName}

      schedule:
        pause_status: "PAUSED"
        quartz_cron_schedule: "0 */30 * * * ?"
        timezone_id: "UTC"

    dq_failure_alert_platinum:
      display_name: "[${bundle.target}] E2E Platinum - DQ failure"
      custom_summary: "Data quality alert: Platinum records quarantined or a write failed"
      custom_description: |
        The Platinum data quality checks found records that break the agreed rules, or a Platinum write failed.
        Quarantined records were not promoted. Each row below is one failed check.

        {{QUERY_RESULT_TABLE}}

        Next step: review the quarantined records, fix the source data (or the rule), and the next run will promote them.

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      # One row per failed check, in a single text column `failed_check` (the email shows only the column
      # the alert evaluates). No line breaks inside the text.
      query_text: |
        SELECT failed_check FROM (
          SELECT CONCAT(
                   INITCAP(layer), ' gate - ', entity, ': ',
                   CAST(rows_quarantined AS STRING), ' of ', CAST(rows_checked AS STRING), ' rows quarantined. ',
                   'Failed rules: ',
                   COALESCE(ARRAY_JOIN(TRANSFORM(MAP_ENTRIES(failed_rules),
                                                 r -> CONCAT(r.key, ' (', CAST(r.value AS STRING), ')')), ', '),
                            'not recorded'), '. ',
                   'Quarantine: ', COALESCE(quarantine_table, 'not recorded'), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC',
                   COALESCE(CONCAT('. Sample records: ', s.sample), '')
                 ) AS failed_check,
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`dq_gate_log` g
          LEFT JOIN (
            -- up to 5 quarantined assets, a few columns each (the quarantine view or table lists current failures)
            SELECT 'asset' AS sample_entity,
                   ARRAY_JOIN(COLLECT_LIST(CONCAT('[', COALESCE(asset_name, 'NULL'),
                              ', type=', COALESCE(asset_type, 'NULL'),
                              ', status=', COALESCE(status, 'NULL'), ']')),
                              ' ; ') AS sample
            FROM (SELECT * FROM `${var.platinum_catalog}`.`${var.platinum_schema}_exception`.`asset_quarantine` LIMIT 5)
          ) s ON g.entity = s.sample_entity
          WHERE status = 'quarantined'
            AND layer = 'platinum'
            AND event_timestamp >= current_timestamp() - INTERVAL 15 MINUTES

          UNION ALL

          SELECT CONCAT(
                   'Write failed - ', `schema`, '.', `table`, ': ', COALESCE(error_type, 'error'), ' - ',
                   LEFT(COALESCE(error_message, ''), 300), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC'
                 ),
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`audit_log`
          WHERE status = 'failure'
            
            AND event_timestamp >= current_timestamp() - INTERVAL 15 MINUTES
        )
        ORDER BY event_timestamp DESC

      warehouse_id: ${var.warehouse_id}

      # IS_NOT_NULL needs no threshold. The Golden Path template compares to an empty string
      # (NOT_EQUAL ""), but the alerts API rejects an empty threshold value (seen with Databricks CLI 1.10).
      evaluation:
        comparison_operator: "IS_NOT_NULL"
        source:
          name: "failed_check"
          display: "failed_check"
        empty_result_state: "OK"   # no rows = no failures = healthy
        notification:
          notify_on_ok: false
          retrigger_seconds: 1
          subscriptions:
            - user_email: ${workspace.current_user.userName}

      # Paused: the job evaluates this alert after every run (alert_task).
      schedule:
        pause_status: "PAUSED"
        quartz_cron_schedule: "0 */30 * * * ?"
        timezone_id: "UTC"
