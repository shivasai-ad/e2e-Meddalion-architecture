# Two Databricks SQL alerts:
#   dq_run_report  Silver + Gold. One email after every run of e2e_medallion_pipeline (an alert_task after the
#                  last task), even when everything passed. It takes the latest Silver/Gold run in dq_gate_log
#                  (matching job_id and run_id) and shows, for that run only:
#                    - a summary table from dq_gate_log (selected columns) with a link to that table,
#                    - the quarantined records of that run from the Silver exception table (all columns that
#                      identify a record, plus the rules it failed), with a link to that table,
#                    - a link to the Gold quarantine table when a Gold gate quarantined rows.
#                  If no Silver/Gold gate was logged in the last 30 minutes it says so.
#   dq_failure_alert_platinum  Platinum, unchanged for now (emails only when something failed).
# Both alerts' own schedules are paused: the jobs evaluate them after every run.
#
# The email shows ONE column (the one the alert evaluates, see the Golden Path note), so each line of the
# report is one row of that column and the "table" is drawn with ' | ' between the fields.
#
# {{QUERY_RESULT_TABLE}} is NOT a bundle placeholder. It is a Databricks alert variable that puts the
# query result into the email. Leave it as it is.

# Links point at Catalog Explorer: ${workspace.host}/explore/data/<catalog>/<schema>/<table>

resources:
  alerts:
    dq_run_report:
      display_name: "[${bundle.target}] E2E - DQ report, Silver and Gold"
      custom_summary: "DQ report for the latest Silver and Gold run"
      custom_description: |
        DQ report for the latest Silver and Gold pipeline run. Silver and Gold are two steps of the same run.

        {{QUERY_RESULT_TABLE}}

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      query_text: |
        WITH latest AS (
          SELECT run_id, job_id
          FROM `${var.catalog}`.`${var.audit_schema}`.`dq_gate_log`
          WHERE layer IN ('silver', 'gold')
            AND event_timestamp >= current_timestamp() - INTERVAL 30 MINUTES
          ORDER BY event_timestamp DESC
          LIMIT 1
        ),
        gates AS (
          SELECT g.layer, g.entity, g.rows_checked, g.rows_passed, g.rows_quarantined, g.status,
                 g.failed_rules, g.quarantine_table, g.event_timestamp
          FROM `${var.catalog}`.`${var.audit_schema}`.`dq_gate_log` g
          JOIN latest l ON g.run_id = l.run_id AND g.job_id = l.job_id
          WHERE g.layer IN ('silver', 'gold')
        ),
        silver_records AS (
          SELECT q.order_id, q.customer_name, q.status, q.amount, q._errors,
                 row_number() OVER (ORDER BY q.order_id) AS rn,
                 count(*) OVER () AS n
          FROM `${var.catalog}`.`${var.formatted_exception_schema}`.`orders_quarantine` q
          JOIN latest l ON q._dq_job_run_id = l.run_id AND q._dq_job_id = l.job_id
        )
        SELECT line FROM (
          -- title: which run this is, or that nothing was logged
          SELECT 0 AS ord, CAST(NULL AS TIMESTAMP) AS ts,
                 CONCAT('DQ report for job run ', l.run_id, ' (job ', l.job_id, '). Layers: Silver, Gold.') AS line
          FROM latest l
          UNION ALL
          SELECT 0, CAST(NULL AS TIMESTAMP),
                 'No Silver or Gold DQ gate result was logged in the last 30 minutes, so there is nothing to report for this run.'
          WHERE NOT EXISTS (SELECT 1 FROM latest)

          -- summary table from dq_gate_log
          UNION ALL
          SELECT 1, CAST(NULL AS TIMESTAMP),
                 'SUMMARY (from dq_gate_log). Table: ${workspace.host}/explore/data/${var.catalog}/${var.audit_schema}/dq_gate_log'
          WHERE EXISTS (SELECT 1 FROM latest)
          UNION ALL
          SELECT 2, CAST(NULL AS TIMESTAMP), 'Layer | Entity | Rows checked | Passed | Quarantined | Status | Failed rules'
          WHERE EXISTS (SELECT 1 FROM latest)
          UNION ALL
          SELECT 3, event_timestamp,
                 CONCAT_WS(' | ', INITCAP(layer), entity, CAST(rows_checked AS STRING), CAST(rows_passed AS STRING),
                           CAST(rows_quarantined AS STRING), status,
                           COALESCE(ARRAY_JOIN(TRANSFORM(MAP_ENTRIES(failed_rules),
                                    r -> CONCAT(r.key, ' (', CAST(r.value AS STRING), ')')), ', '), '-'))
          FROM gates
          UNION ALL
          SELECT 4, CAST(NULL AS TIMESTAMP), 'All DQ checks passed in this run.'
          WHERE EXISTS (SELECT 1 FROM latest) AND NOT EXISTS (SELECT 1 FROM gates WHERE rows_quarantined > 0)

          -- quarantined records of this run, Silver
          UNION ALL
          SELECT 5, CAST(NULL AS TIMESTAMP),
                 CONCAT('SILVER - quarantined records of this run: ', CAST(max(n) AS STRING),
                        '. Table: ${workspace.host}/explore/data/${var.catalog}/${var.formatted_exception_schema}/orders_quarantine')
          FROM silver_records
          HAVING count(*) > 0
          UNION ALL
          SELECT 6, CAST(NULL AS TIMESTAMP), 'Layer | order_id | customer_name | status | amount | Failed rules'
          WHERE EXISTS (SELECT 1 FROM silver_records)
          UNION ALL
          SELECT 7, CAST(rn AS TIMESTAMP),
                 CONCAT_WS(' | ', 'Silver', COALESCE(order_id, 'NULL'), COALESCE(customer_name, 'NULL'),
                           COALESCE(status, 'NULL'), COALESCE(CAST(amount AS STRING), 'NULL'),
                           COALESCE(ARRAY_JOIN(TRANSFORM(_errors, e -> e.name), ', '), 'unknown'))
          FROM silver_records

          -- Gold: link to its quarantine table when a Gold gate quarantined rows
          UNION ALL
          SELECT 8, CAST(NULL AS TIMESTAMP),
                 CONCAT('GOLD - ', CAST(rows_quarantined AS STRING), ' record(s) quarantined for ', entity,
                        '. Table: ${workspace.host}/explore/data/', REPLACE(quarantine_table, '.', '/'))
          FROM gates
          WHERE layer = 'gold' AND rows_quarantined > 0
        )
        ORDER BY ord, ts

      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: "IS_NOT_NULL"
        source:
          name: "line"
          display: "line"
        empty_result_state: "OK"
        notification:
          notify_on_ok: false
          retrigger_seconds: 1
          subscriptions:
            - user_email: ${workspace.current_user.userName}

      schedule:
        pause_status: "PAUSED"
        quartz_cron_schedule: "0 */30 * * * ?"
        timezone_id: "UTC"

    dq_failure_alert_platinum:
      display_name: "[${bundle.target}] E2E Platinum - DQ failure"
      custom_summary: "Data quality alert: Platinum records quarantined or a write failed"
      custom_description: |
        The Platinum data quality checks found records that break the agreed rules, or a Platinum write failed.
        Quarantined records were not promoted. Each row below is one failed check.

        {{QUERY_RESULT_TABLE}}

        Next step: review the quarantined records, fix the source data (or the rule), and the next run will promote them.

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      # One row per failed check, in a single text column `failed_check` (the email shows only the column
      # the alert evaluates). No line breaks inside the text.
      query_text: |
        SELECT failed_check FROM (
          SELECT CONCAT(
                   INITCAP(layer), ' gate - ', entity, ': ',
                   CAST(rows_quarantined AS STRING), ' of ', CAST(rows_checked AS STRING), ' rows quarantined. ',
                   'Failed rules: ',
                   COALESCE(ARRAY_JOIN(TRANSFORM(MAP_ENTRIES(failed_rules),
                                                 r -> CONCAT(r.key, ' (', CAST(r.value AS STRING), ')')), ', '),
                            'not recorded'), '. ',
                   'Quarantine: ', COALESCE(quarantine_table, 'not recorded'), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC',
                   COALESCE(CONCAT('. Sample records: ', s.sample), '')
                 ) AS failed_check,
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`dq_gate_log` g
          LEFT JOIN (
            -- up to 5 quarantined assets, a few columns each (the quarantine view or table lists current failures)
            SELECT 'asset' AS sample_entity,
                   ARRAY_JOIN(COLLECT_LIST(CONCAT('[', COALESCE(asset_name, 'NULL'),
                              ', type=', COALESCE(asset_type, 'NULL'),
                              ', status=', COALESCE(status, 'NULL'), ']')),
                              ' ; ') AS sample
            FROM (SELECT * FROM `${var.platinum_catalog}`.`${var.platinum_schema}_exception`.`asset_quarantine` LIMIT 5)
          ) s ON g.entity = s.sample_entity
          WHERE status = 'quarantined'
            AND layer = 'platinum'
            AND event_timestamp >= current_timestamp() - INTERVAL 15 MINUTES

          UNION ALL

          SELECT CONCAT(
                   'Write failed - ', `schema`, '.', `table`, ': ', COALESCE(error_type, 'error'), ' - ',
                   LEFT(COALESCE(error_message, ''), 300), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC'
                 ),
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`audit_log`
          WHERE status = 'failure'
            
            AND event_timestamp >= current_timestamp() - INTERVAL 15 MINUTES
        )
        ORDER BY event_timestamp DESC

      warehouse_id: ${var.warehouse_id}

      # IS_NOT_NULL needs no threshold. The Golden Path template compares to an empty string
      # (NOT_EQUAL ""), but the alerts API rejects an empty threshold value (seen with Databricks CLI 1.10).
      evaluation:
        comparison_operator: "IS_NOT_NULL"
        source:
          name: "failed_check"
          display: "failed_check"
        empty_result_state: "OK"   # no rows = no failures = healthy
        notification:
          notify_on_ok: false
          retrigger_seconds: 1
          subscriptions:
            - user_email: ${workspace.current_user.userName}

      # Paused: the job evaluates this alert after every run (alert_task).
      schedule:
        pause_status: "PAUSED"
        quartz_cron_schedule: "0 */30 * * * ?"
        timezone_id: "UTC"
