# DQ failure -> email (ported from aws-databricks-goldenpath docs/databricks_objects/09_alerts/dq_failure_alert.yml, ADP-933)
#
# A Databricks SQL alert, every 30 minutes. It reads the two tables the Platinum job writes in
# <platinum_catalog>.<platinum_schema>_audit:
#   dq_gate_log  one row per DQ gate run; status = 'quarantined' when any row failed a rule.
#   audit_log    one row per write; status = 'failure' when a write raised.
# One row of text per failure; no rows means the alert stays OK and sends nothing.
# The query window (30 minutes) matches the schedule, so each failure is emailed once.
#
# {{QUERY_RESULT_TABLE}} is NOT a bundle placeholder. It is a Databricks alert variable that puts the
# query result into the email. Leave it as it is.
#
# Differences from the Golden Path template: it reads the Platinum audit schema (bundle variables
# platinum_catalog / platinum_schema), and it emails the user who deploys it, so there is no
# team_name, data_owner_email or service principal variable to set.

resources:
  alerts:
    dq_failure_alert:
      display_name: "[${bundle.target}] E2E Platinum - DQ failure"
      custom_summary: "Data quality alert: Platinum records quarantined"
      custom_description: |
        Data quality checks on the Platinum publish found records that break the agreed rules.
        These records were quarantined and were not published. Each row below is one failed check.

        {{QUERY_RESULT_TABLE}}

        Next step: review the quarantined records, fix the source data (or the rule), and the next run will publish them.

      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE

      # One row per failed check, in a single text column `failed_check`. The email only shows the
      # column the alert evaluates, so the reason has to be in it. No line breaks inside the text.
      query_text: |
        SELECT failed_check FROM (
          SELECT CONCAT(
                   INITCAP(layer), ' gate - ', entity, ': ',
                   CAST(rows_quarantined AS STRING), ' of ', CAST(rows_checked AS STRING), ' rows quarantined. ',
                   'Failed rules: ',
                   COALESCE(ARRAY_JOIN(TRANSFORM(MAP_ENTRIES(failed_rules),
                                                 r -> CONCAT(r.key, ' (', CAST(r.value AS STRING), ')')), ', '),
                            'not recorded'), '. ',
                   'Quarantine: ', COALESCE(quarantine_table, 'not recorded'), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC'
                 ) AS failed_check,
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`dq_gate_log`
          WHERE status = 'quarantined'
            AND event_timestamp >= current_timestamp() - INTERVAL 30 MINUTES

          UNION ALL

          SELECT CONCAT(
                   'Write failed - ', `table`, ': ', COALESCE(error_type, 'error'), ' - ',
                   LEFT(COALESCE(error_message, ''), 300), '. ',
                   'Run: ', DATE_FORMAT(event_timestamp, 'yyyy-MM-dd HH:mm'), ' UTC'
                 ),
                 event_timestamp
          FROM `${var.platinum_catalog}`.`${var.platinum_schema}_audit`.`audit_log`
          WHERE status = 'failure'
            AND event_timestamp >= current_timestamp() - INTERVAL 30 MINUTES
        )
        ORDER BY event_timestamp DESC

      warehouse_id: ${var.warehouse_id}

      # IS_NOT_NULL needs no threshold. The Golden Path template compares to an empty string
      # (NOT_EQUAL ""), but the alerts API rejects an empty threshold value ("evaluation.threshold is
      # provided but doesn't contain any value", seen deploying with Databricks CLI 1.10 on 2026-11-10).
      evaluation:
        comparison_operator: "IS_NOT_NULL"
        source:
          name: "failed_check"
          display: "failed_check"
        empty_result_state: "OK"   # no rows = no failures = healthy
        notification:
          notify_on_ok: false
          retrigger_seconds: 1     # email on every run that finds new failures
          subscriptions:
            - user_email: ${workspace.current_user.userName}

      schedule:
        pause_status: "UNPAUSED"
        quartz_cron_schedule: "0 */30 * * * ?"   # every 30 min, in step with the query window
        timezone_id: "UTC"
