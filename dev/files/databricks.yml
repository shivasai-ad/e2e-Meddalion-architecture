# E2E test harness for the Medallion CDC-Fed pattern (DAA-856).
#
# Standalone bundle, deliberately separate from any team's real pipeline
# bundle (e.g. adi-databricks-engine-payments-dev). See README.md for why.

bundle:
  name: e2e-medallion-pattern-test-copy
  # Deploy-lock reads/writes go through workspace/export, which this
  # network's proxy (Zscaler) blocks with "not allowed to access this file
  # type". Locking only matters for concurrent deploys by multiple people;
  # this is a personal single-developer bundle, so it's safe to disable.
  deployment:
    lock:
      enabled: false

variables:
  catalog:
    description: >-
      Unity Catalog catalog this harness reads/writes. Must grant the
      deploying user CREATE_SCHEMA + CREATE_TABLE. Default is `rls_testing`,
      a personal sandbox catalog -- see README.md "Why rls_testing" for how
      that was chosen.
    default: rls_testing
  use_external_tables:
    description: >-
      "true" = CREATE EXTERNAL TABLE at the golden path's own S3 convention
      (medallion-cdc-fed-pattern.md); "false" = UC managed tables. See
      README.md "Why external tables" for how external access was confirmed.
    default: "true"
  formatted_bucket:
    description: S3 bucket backing Staging/Bronze/Silver/audit external tables.
    default: ad-dna-eu-central-1-dev-datalake-formatted-156041432080
  published_bucket:
    description: S3 bucket backing Gold external tables.
    default: ad-dna-eu-central-1-dev-datalake-published-156041432080
  gold_source_catalog:
    description: Catalog the Platinum publish job reads Gold tables from (ADP-1026).
    default: rls_testing
  gold_source_schema:
    description: Gold schema the Platinum publish job reads from (ADP-1026).
    default: ad_published
  platinum_catalog:
    description: >-
      Catalog the Platinum publish job writes to: the platform-owned Platinum catalog
      (created by adi-databricks-infra-dataplatform). Override with --var if needed.
    default: dev_platinum_catalog
  platinum_schema:
    description: >-
      Schema the Platinum publish job writes to (ADP-1026). A manual test schema in
      dev_platinum_catalog, not managed by Terraform.
    default: ad_rls_testing_platinum
  audit_schema:
    description: Audit schema holding the Silver and Gold dq_gate_log and audit_log (config_loader SCHEMAS['audit']).
    default: e2e_medallion_metadata_v2_audit
  formatted_exception_schema:
    description: Silver quarantine schema; the Silver DQ alert samples quarantined records from it (config_loader SCHEMAS['formatted_exception']).
    default: e2e_medallion_metadata_v2_formatted_exception
  warehouse_id:
    description: SQL warehouse the DQ failure alert runs its query on. Set per target below.

include:
  - resources/jobs/*.yml
  - resources/alerts/*.yml

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-445a81b8-2855.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
    variables:
      warehouse_id: adb090f2a817666b   # Serverless Starter Warehouse (ADI)

  # Dev workspace (dbc-13eada50-8f08, CLI profile `dev`). Uses UC managed tables
  # so the audit table does not depend on leftover S3 files from earlier runs.
  dev-workspace:
    workspace:
      host: https://dbc-13eada50-8f08.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev-workspace
    variables:
      use_external_tables: "false"
      warehouse_id: 4cfe5f4dc76c52de   # dev-serverless-warehouse (ad workspace)
