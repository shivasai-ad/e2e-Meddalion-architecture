  # ─────────────────────────────────────────────────────────────────────────
  # REAL DATA TABLES (from rls_testing.ad_published catalog)
  # ─────────────────────────────────────────────────────────────────────────

  orders:
    requires_compliance: true
    description: "Order master data — order identifiers, customer information, status, and amounts"
    owner: "data-engineers"
    tags:
      source_system: "orders_system"
      source_squad: "data-team"
      dataset: "orders"
      data_owner: "Sales Operations"
      refresh_cadence: daily
      client_id: "default_client"
    columns:
      order_id:
        type: STRING
        description: "Unique order identifier (primary key)"
        tags:
          sensitivity: internal
      customer_name:
        type: STRING
        description: "Customer name for this order"
        tags:
          sensitivity: public
      status:
        type: STRING
        description: "Order status (pending, completed, refunded)"
        tags:
          sensitivity: public
      amount:
        type: DOUBLE
        description: "Order amount in base currency"
        tags:
          sensitivity: confidential
      total_tax_amount:
        type: DOUBLE
        description: "Order amount including 18% tax (amount * 1.18)"
        tags:
          sensitivity: confidential
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_order_id
        type: "PRIMARY_KEY"
        columns: ["order_id"]
      - name: valid_order_amount
        type: "CHECK"
        check: "amount IS NOT NULL AND amount > 0"

  asset:
    requires_compliance: true
    description: "Asset master data — asset identifiers, names, types, and investment characteristics"
    owner: "data-engineers"
    tags:
      source_system: "asset_master"
      source_squad: "data-team"
      dataset: "asset_master"
      data_owner: "Investment Operations"
      refresh_cadence: daily
      client_id: "default_client"
    columns:
      entity_master_asset_id:
        type: STRING
        description: "Master data entity identifier for asset (primary key)"
        tags:
          sensitivity: internal
      asset_name:
        type: STRING
        description: "Asset name"
        tags:
          sensitivity: public
      asset_type:
        type: STRING
        description: "Classification of asset type"
        tags:
          sensitivity: public
      currency:
        type: STRING
        description: "Primary currency for asset valuation"
        tags:
          sensitivity: public
      status:
        type: STRING
        description: "Current status of the asset"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_asset_id
        type: "PRIMARY_KEY"
        columns: ["entity_master_asset_id"]

  document:
    requires_compliance: true
    description: "Document master data — document identifiers, metadata, and tracking information"
    owner: "data-engineers"
    tags:
      source_system: "document_management"
      source_squad: "data-team"
      dataset: "documents"
      data_owner: "Operations"
      refresh_cadence: daily
      client_id: "default_client"
    columns:
      document_id:
        type: STRING
        description: "Unique document identifier (primary key)"
        tags:
          sensitivity: internal
      original_file_name:
        type: STRING
        description: "Original filename of the document"
        tags:
          sensitivity: public
      classification:
        type: STRING
        description: "Document classification level or type"
        tags:
          sensitivity: public
      document_received_date:
        type: DATE
        description: "Date document was received"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_document_id
        type: "PRIMARY_KEY"
        columns: ["document_id"]

  document_banking:
    requires_compliance: true
    description: "Banking information from documents — beneficiary and bank account details"
    owner: "data-engineers"
    tags:
      source_system: "banking_extraction"
      source_squad: "data-team"
      dataset: "banking_details"
      data_owner: "Finance Operations"
      refresh_cadence: daily
      client_id: "default_client"
    columns:
      document_id:
        type: STRING
        description: "Reference to source document (primary key)"
        tags:
          sensitivity: internal
      beneficiary_bank_name:
        type: STRING
        description: "Name of beneficiary bank"
        tags:
          sensitivity: confidential
      beneficiary_account_name:
        type: STRING
        description: "Name of beneficiary account"
        tags:
          sensitivity: confidential
      bank_location:
        type: STRING
        description: "Geographic location of primary bank"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_document_banking_id
        type: "PRIMARY_KEY"
        columns: ["document_id"]

