# ═══════════════════════════════════════════════════════════════════════════
# Gold Table Compliance Metadata Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Defines compliance metadata for every gold (published) table.
# Consumed by gold notebooks via the compliance loader in common_utils.
#
# ADDING A NEW TABLE:
#   1. Copy the template block at the bottom of this file
#   2. Fill in all required fields
#   3. Raise a PR for review
#
# STRUCTURE:
#   requires_compliance: true  → all fields below are mandatory
#   requires_compliance: false → table is exempt (provide reason)
#
# NOTE: Column-level `entity_id` and `client_id` tags are maintained
#       separately by the governed tag `custom_claim` process.
#       They are NOT part of this compliance gate.
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠️  YAML SYNTAX RULES (IMPORTANT!)
# ═══════════════════════════════════════════════════════════════════════════
# 1. STRING VALUES WITH SPECIAL CHARACTERS must be quoted:
#    ❌ WRONG:  description: Fund data — structures
#    ✅ RIGHT:  description: "Fund data — structures"
#    (Special chars: — – : { } [ ] & * # @ ! | > ' ")
#
# 2. INDENTATION must use SPACES (2 or 4), NEVER use tabs:
#    ❌ WRONG:  [TAB]description: "..."
#    ✅ RIGHT:  [2 SPACES]description: "..."
#
# 3. COLONS (:) IN STRING VALUES need quotes:
#    ❌ WRONG:  description: data: fund info
#    ✅ RIGHT:  description: "data: fund info"
#
# 4. LISTS must be indented and start with dash-space:
#    ❌ WRONG:  columns: [col1, col2]
#    ✅ RIGHT:  columns:
#               - col1
#               - col2
#
# 5. CHECK CONSTRAINT EXPRESSIONS need quotes:
#    ❌ WRONG:  check: currency IS NOT NULL AND length(currency) = 3
#    ✅ RIGHT:  check: "currency IS NOT NULL AND length(currency) = 3"
#
# 6. BOOLEANS without quotes are interpreted as boolean (true/false):
#    ✅ RIGHT:  requires_compliance: true
#    (Don't quote true/false unless you want the string "true"/"false")
#
# If you get a YAML syntax error, check:
#   → Did you add quotes around strings with special characters?
#   → Did you use spaces for indentation (not tabs)?
#   → Did you quote string values with colons?
# ═══════════════════════════════════════════════════════════════════════════

