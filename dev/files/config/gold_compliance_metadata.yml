        description: "Format type for metric values (Percentage, Currency, Decimal)"
        tags:
          sensitivity: public
      is_active:
        type: BOOLEAN
        description: "Whether metric is currently active"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_metric_name
        type: "PRIMARY_KEY"
        columns: ["metric_name"]

  ref_transaction_type:
    requires_compliance: true
    description: "Reference transaction type definitions — transaction classification and rules"
    owner: "data-engineers"
    tags:
      source_system: "reference_data"
      source_squad: "data-team"
      dataset: "transaction_types"
      data_owner: "Operations"
      refresh_cadence: weekly
      client_id: "default_client"
    columns:
      transaction_type:
        type: STRING
        description: "Unique transaction type identifier (primary key)"
        tags:
          sensitivity: public
      display_name:
        type: STRING
        description: "Display name for transaction type"
        tags:
          sensitivity: public
      category:
        type: STRING
        description: "High-level category of transaction (Cash Flow, Adjustment)"
        tags:
          sensitivity: public
      subcategory:
        type: STRING
        description: "Subcategory for more detailed classification"
        tags:
          sensitivity: public
      is_active:
        type: BOOLEAN
        description: "Whether transaction type is currently active"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_transaction_type
        type: "PRIMARY_KEY"
        columns: ["transaction_type"]

  transaction:
    requires_compliance: true
    description: "Transaction data — investment cash flows, distributions, and adjustments"
    owner: "data-engineers"
    tags:
      source_system: "transaction_ledger"
      source_squad: "data-team"
      dataset: "transactions"
      data_owner: "Finance Operations"
      refresh_cadence: daily
      client_id: "default_client"
    columns:
      transaction_id:
        type: STRING
        description: "Unique transaction identifier (primary key)"
        tags:
          sensitivity: internal
      position_id:
        type: STRING
        description: "Reference to position entity"
        tags:
          sensitivity: internal
      transaction_type:
        type: STRING
        description: "Type of transaction (Capital Call, Distribution)"
        tags:
          sensitivity: public
      amount:
        type: DOUBLE
        description: "Transaction amount"
        tags:
          sensitivity: confidential
      currency:
        type: STRING
        description: "Currency of transaction amount"
        tags:
          sensitivity: public
      trade_date:
        type: DATE
        description: "Date of transaction trade or execution"
        tags:
          sensitivity: public
      _gold_refreshed_at:
        type: TIMESTAMP
        description: "Timestamp when Gold table was last refreshed"
        tags:
          sensitivity: internal
    constraints:
      - name: pk_transaction_id
        type: "PRIMARY_KEY"
        columns: ["transaction_id"]

