# Silver -> Gold data-quality rules. ONE file for every Gold table.
# Applied to the rows before they are written to Gold.
# Every check is pass/fail: a row that fails ANY check goes to the published_exception
# quarantine table, and a row that passes all checks continues to Gold.
# Each check names its own function (is_not_null, is_not_null_and_not_empty, is_in_list,
# sql_expression, ...). Add or change checks here; no code change is needed.
# Gold-calculated columns (total_tax_amount, _gold_refreshed_at) are not checked here,
# since they do not exist in Silver yet.
tables:
  orders:
    checks:
      - name: orders_order_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: order_id
      - name: orders_customer_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: customer_name
      - name: orders_status_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: status
      - name: orders_amount_not_null
        check:
          function: is_not_null
          arguments:
            column: amount
      - name: status_allowed_values
        check:
          function: is_in_list
          arguments:
            column: status
            allowed: ["'pending'", "'completed'", "'refunded'"]  # DQX: quoted = literal value
      - name: amount_positive
        check:
          function: sql_expression
          arguments:
            expression: amount IS NOT NULL AND amount > 0
            msg: amount must be present and greater than 0
            columns: ["amount"]

  asset:
    checks:
      - name: asset_entity_master_asset_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: entity_master_asset_id
      - name: asset_asset_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: asset_name
      - name: asset_asset_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: asset_type
      - name: asset_currency_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: currency
      - name: asset_status_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: status

  document:
    checks:
      - name: document_document_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: document_id
      - name: document_original_file_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: original_file_name
      - name: document_classification_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: classification
      - name: document_document_received_date_not_null
        check:
          function: is_not_null
          arguments:
            column: document_received_date

  document_banking:
    checks:
      - name: document_banking_document_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: document_id
      - name: document_banking_beneficiary_bank_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: beneficiary_bank_name
      - name: document_banking_bank_location_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: bank_location
      - name: document_banking_beneficiary_account_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: beneficiary_account_name

  owner:
    checks:
      - name: owner_entity_master_owner_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: entity_master_owner_id
      - name: owner_owner_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: owner_name
      - name: owner_owner_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: owner_type

  performance_metric:
    checks:
      - name: performance_metric_performance_metric_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: performance_metric_id
      - name: performance_metric_metric_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: metric_name
      - name: performance_metric_period_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: period_type
      - name: performance_metric_metric_value_not_null
        check:
          function: is_not_null
          arguments:
            column: metric_value

  position:
    checks:
      - name: position_entity_master_position_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: entity_master_position_id
      - name: position_owner_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: owner_id
      - name: position_asset_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: asset_id
      - name: position_status_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: status
      # Parent must exist: the owner_id / asset_id must be present in the Gold parent tables.
      # (Unity Catalog foreign keys are informational, so this rule is what enforces them.)
      - name: position_owner_exists
        check:
          function: foreign_key
          arguments:
            columns: ["owner_id"]
            ref_columns: ["entity_master_owner_id"]
            ref_table: rls_testing.e2e_medallion_metadata_v2_gold.owner
      - name: position_asset_exists
        check:
          function: foreign_key
          arguments:
            columns: ["asset_id"]
            ref_columns: ["entity_master_asset_id"]
            ref_table: rls_testing.e2e_medallion_metadata_v2_gold.asset

  ref_metric:
    checks:
      - name: ref_metric_metric_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: metric_name
      - name: ref_metric_display_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: display_name
      - name: ref_metric_category_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: category
      - name: ref_metric_format_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: format_type
      - name: ref_metric_is_active_not_null
        check:
          function: is_not_null
          arguments:
            column: is_active

  ref_transaction_type:
    checks:
      - name: ref_transaction_type_transaction_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: transaction_type
      - name: ref_transaction_type_display_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: display_name
      - name: ref_transaction_type_category_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: category
      - name: ref_transaction_type_subcategory_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: subcategory
      - name: ref_transaction_type_is_active_not_null
        check:
          function: is_not_null
          arguments:
            column: is_active

  transaction:
    checks:
      - name: transaction_transaction_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: transaction_id
      - name: transaction_position_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: position_id
      - name: transaction_transaction_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: transaction_type
      - name: transaction_amount_not_null
        check:
          function: is_not_null
          arguments:
            column: amount
      - name: transaction_currency_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: currency
      - name: transaction_trade_date_not_null
        check:
          function: is_not_null
          arguments:
            column: trade_date

  # ─────────────────────────────────────────────────────────────────────────
  # DERIVED GOLD TABLES (config/gold_derived_tables.yml)
  # The gate runs on the finished table, after the joins and aggregations, so
  # these rules name the columns of the derived table. Aggregate and outlier
  # checks look at the whole table (or one group), and a failing group is
  # quarantined as a whole.
  # ─────────────────────────────────────────────────────────────────────────

  # JOIN: transaction + position + owner + asset
  transaction_detail:
    checks:
      - name: transaction_detail_id_format
        check:
          function: regex_match
          arguments:
            column: transaction_id
            regex: "^TXN-[0-9]+$"
      - name: transaction_detail_amount_and_names_present
        check:
          function: sql_expression
          arguments:
            expression: amount IS NOT NULL AND amount > 0 AND owner_name IS NOT NULL AND asset_name IS NOT NULL
            msg: amount must be above 0, and the owner and asset names must be present after the join
            columns: ["amount", "owner_name", "asset_name"]
      - name: transaction_detail_minimum_rows
        check:
          function: is_aggr_not_less_than
          arguments:
            column: transaction_id
            aggr_type: count
            limit: 10
      - name: transaction_detail_amount_no_outliers
        check:
          function: has_no_outliers
          arguments:
            column: amount
      - name: transaction_detail_daily_total_no_outliers
        check:
          function: has_no_aggr_outliers
          arguments:
            column: amount
            time_column: trade_date
            aggr_type: sum

  # AGGREGATE: orders grouped by status
  order_status_summary:
    checks:
      - name: order_status_summary_status_format
        check:
          function: regex_match
          arguments:
            column: status
            regex: "^(pending|completed|refunded)$"
      - name: order_status_summary_counts_and_amounts_valid
        check:
          function: sql_expression
          arguments:
            expression: order_count > 0 AND total_amount >= 0 AND avg_amount > 0
            msg: order_count must be above 0 and the amounts must not be negative
            columns: ["order_count", "total_amount", "avg_amount"]
      - name: order_status_summary_minimum_groups
        check:
          function: is_aggr_not_less_than
          arguments:
            column: status
            aggr_type: count
            limit: 3
      # Demo threshold: a status whose total goes above 400 is held back.
      - name: order_status_summary_total_cap
        check:
          function: is_aggr_not_greater_than
          arguments:
            column: total_amount
            aggr_type: sum
            limit: 400
            group_by: ["status"]

  # JOIN + AGGREGATE: transaction + position + owner, grouped by owner
  owner_exposure:
    checks:
      - name: owner_exposure_owner_id_format
        check:
          function: regex_match
          arguments:
            column: owner_id
            regex: "^OWN-[0-9]+$"
      - name: owner_exposure_totals_consistent
        check:
          function: sql_expression
          arguments:
            expression: txn_count > 0 AND total_amount >= 0 AND abs(avg_amount * txn_count - total_amount) < 1
            msg: txn_count must be above 0, and the total must match the average times the count
            columns: ["txn_count", "total_amount", "avg_amount"]
      - name: owner_exposure_minimum_owners
        check:
          function: is_aggr_not_less_than
          arguments:
            column: owner_id
            aggr_type: count
            limit: 2
      - name: owner_exposure_total_cap
        check:
          function: is_aggr_not_greater_than
          arguments:
            column: total_amount
            aggr_type: sum
            limit: 1000000
