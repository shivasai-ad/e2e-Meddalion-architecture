# Silver -> Gold data-quality rules. ONE file for every Gold table.
# Applied to the rows before they are written to Gold.
# Every check is pass/fail: a row that fails ANY check goes to the published_exception
# quarantine table, and a row that passes all checks continues to Gold.
# Each check names its own function (is_not_null, is_not_null_and_not_empty, is_in_list,
# sql_expression, ...). Add or change checks here; no code change is needed.
# Gold-calculated columns (total_tax_amount, _gold_refreshed_at) are not checked here,
# since they do not exist in Silver yet.
tables:
  orders:
    checks:
      - name: orders_order_id_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: order_id
      - name: orders_customer_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: customer_name
      - name: orders_status_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: status
      - name: orders_amount_not_null
        check:
          function: is_not_null
          arguments:
            column: amount
      - name: status_allowed_values
        check:
          function: is_in_list
          arguments:
            column: status
            allowed: ['pending', 'completed', 'refunded']
      - name: amount_positive
        check:
          function: sql_expression
          arguments:
            expression: amount IS NOT NULL AND amount > 0
            msg: amount must be present and greater than 0
            columns: ["amount"]

