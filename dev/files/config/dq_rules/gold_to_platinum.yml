# Each table has up to two parts, written by hand:
#   checks:  the DQ gate. It runs AFTER the column handling, on the rows that will be published
#            (allowed columns kept, masks applied, treat columns nulled). A row that fails any check
#            goes to the Platinum quarantine table and is not published. A rule may only name a column
#            Platinum keeps; the job fails before writing if a rule names any other column.
#   treat:   optional. {column: null} forces a kept column to NULL in Platinum (stricter only).
#            Use a masked-value check in checks to confirm restricted columns are masked (see
#            vendor_iban example below). A sql_expression passes when it evaluates to true.
#
# Add or change checks here; no code change is needed.
tables:
  asset:
    # Example of treat + a check that confirms it (not active for asset, which has no restricted column):
    #   treat: { vendor_iban: "null" }
    #   checks:
    #     - name: asset_vendor_iban_is_null
    #       check:
    #         function: sql_expression
    #         arguments: { expression: "vendor_iban IS NULL", msg: "vendor_iban must be NULL in Platinum", columns: ["vendor_iban"] }
    checks:
      # Customer-facing fields. status mirrors Gold's own rule (silver_to_gold.yml: asset_status_not_empty).
      - name: asset_asset_name_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: asset_name
      - name: asset_asset_type_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: asset_type
      - name: asset_status_not_empty
        check:
          function: is_not_null_and_not_empty
          arguments:
            column: status
      # Format and range.
      - name: asset_currency_iso_format
        check:
          function: regex_match
          arguments:
            column: currency
            regex: "^[A-Z]{3}$"
      - name: asset_fund_size_not_negative
        check:
          function: sql_expression
          arguments:
            expression: fund_size IS NULL OR fund_size >= 0
            msg: fund_size must not be negative
            columns: ["fund_size"]
